/**/hex_ros_isaacsim_archer_y6:
  ros__parameters:
    # Fixed command forwarding rate in Hz.
    ctrl_rate: 1000.0
    # Isaac Sim publishes /clock; the node follows simulation time.
    use_sim_time: true
    # Supported values: empty (0 DoF), gp80 (1 DoF), gr100 (2 DoF).
    robot_grip_type: "gr100"
    # Existing Archer URDF is used only for EE inverse kinematics.
    urdf_path: ""
    # Isaac Sim ROS bridge command topic.
    joint_command_topic: "/joint_command"
    # Isaac Sim ROS bridge state topic used to capture joint names.
    joint_state_topic: "/joint_states"
